<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthy BMI Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <section class="home" id="home">
            <div class="icon">⚕️</div>
            <h1>Healthy BMI Tracker</h1>
            <p>Hitung Indeks Massa Tubuh (IMT) dengan mudah</p>
            <button onclick="mulaiHitung()">Mulai Hitung IMT</button>
        </section>

        <section class="form-section" id="formSection">
            <h2>Data Pengguna</h2>

            <form id="bmiForm">

                <label for="nama">Nama</label>
                <input type="text" id="nama" placeholder="Masukkan nama">

                <label for="gender">Jenis Kelamin</label>
                <select id="gender">
                    <option value="">Pilih jenis kelamin</option>
                    <option value="Laki-laki">Laki-laki</option>
                    <option value="Perempuan">Perempuan</option>
                </select>

                <label for="umur">Umur</label>
                <input type="number" id="umur" placeholder="Masukkan umur">

                <label for="berat">Berat Badan (kg)</label>
                <input type="number" id="berat" placeholder="Masukkan berat badan">

                <label for="tinggi">Tinggi Badan (cm)</label>
                <input type="number" id="tinggi" placeholder="Masukkan tinggi badan">

                <p id="error"></p>

                <button type="submit">Hitung IMT</button>
                <button type="button" class="reset" onclick="resetForm()">Reset</button>

            </form>
        </section>

        <section class="hasil" id="hasil">
            <h2>Hasil Perhitungan</h2>

            <div class="hasil-box">
                <p>Nama: <span id="hasilNama"></span></p>
                <p>Berat Badan: <span id="hasilBerat"></span> kg</p>
                <p>Tinggi Badan: <span id="hasilTinggi"></span> cm</p>
                <p>Nilai IMT: <strong id="nilaiImt"></strong></p>
                <p>Kategori: <strong id="kategori"></strong></p>
            </div>

            <div class="saran">
                <h3>Saran Kesehatan</h3>
                <p id="saranKesehatan"></p>
            </div>

            <button onclick="resetForm()">Hitung Lagi</button>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
